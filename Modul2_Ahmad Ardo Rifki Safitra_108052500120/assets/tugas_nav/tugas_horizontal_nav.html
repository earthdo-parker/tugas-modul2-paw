<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizontal Navigation</title>
    <style>
        /* Reset dasar: hilangkan margin bawaan browser */
        body {
            margin: 0;
            padding: 0;
            font-family: Tahoma, Verdana, Geneva, sans-serif;
        }

        /* Container navigasi: latar abu-abu muda, lebarnya mengikuti isi menu */
        nav {
            display: inline-block;
            background-color: #ebebeb;
            margin: 10px;
        }

        /* Hilangkan bullet, buang margin/padding, susun item ke samping */
        nav ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            display: flex;
        }

        /* Tautan dijadikan block agar seluruh area (bukan hanya teks) bisa diklik */
        nav li a {
            display: block;
            height: 55px;
            line-height: 55px;          /* sama dengan height -> teks rata tengah vertikal */
            padding: 0 2em;
            font-size: 1.1rem;
            color: #555;
            text-decoration: none;
            text-transform: uppercase;
            border-bottom: 5px solid #ddd;  /* garis bawah tipis seperti di contoh */
            transition: all 0.3s;
        }

        /* Efek saat kursor di atas menu */
        nav li a:hover {
            background-color: #4a4a4a;
            color: white;
            border-bottom-color: #41adad;
        }

        /* Menu aktif (halaman yang sedang dibuka) */
        nav li a.active {
            background-color: #41adad;
            color: white;
            border-bottom-color: #2f8f8f;
        }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li><a href="#" class="active">Home</a></li>
            <li><a href="#">Service</a></li>
            <li><a href="#">Project</a></li>
            <li><a href="#">About</a></li>
        </ul>
    </nav>
</body>
</html>
